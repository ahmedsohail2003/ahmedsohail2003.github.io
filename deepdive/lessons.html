<h1>Lessons — what one work-cell taught five times</h1>
<p class="subtitle">The cross-cutting findings that no single chapter owns, the series'
honest limitations, and what comes next.</p>

<script type="text/markdown">
## The pieces talk to each other

The series is one system, not five demos. Part A's environment, IK, and scripted
expert generate the datasets Part B fine-tunes on. Part C's pose estimator becomes
Part E's C++ ROS 2 service — same algorithm, two languages, verified to 0.000 mm
parity. Part D reuses the same arm and cell for reward-driven learning. And the
evaluation protocol — held-out seeds, printed n, paired comparisons — is identical
everywhere, which is what makes the cross-method comparisons meaningful.

## Lesson 1 — the data decides more than the architecture, until it doesn't

The single most repeated finding. Domain-randomized training data took ACT from 65%
to 90% *on the unrandomized task* — regularization, not a robustness tax (measured,
Part A). Targeted pocket data closed the exact hole it aimed at and opened a new one
elsewhere under a fixed training budget (measured, Part A/dr2). And the same
recovery-demo dataset moved two architectures in opposite directions — ACT −15,
SmolVLA +35 (measured, Parts A/B) — because chunked L1 regression averages across
behavior modes while flow matching models them. So: data quality dominates *within*
an architecture class, but whether behavioral diversity is signal or poison is an
*architectural* property. Neither "it's all data" nor "it's all architecture"
survives contact with these numbers.

## Lesson 2 — simulation fails silently; assert your observations

Every project hit at least one failure that produced no error, just wrong numbers:
MuJoCo renderers silently emitting all-black frames after a GL teardown (a false
"policy collapsed to 0%" headline, Part A); a reset bug truncating every episode to
one step (all early PPO results invalid, Part D); ROS 2's latched topics reporting
stale state as fresh (Part E's build log documents nine such modes). The fix is the
same everywhere: treat observation statistics as assertable invariants — non-black
frames, nonzero episode lengths, lifecycle probes instead of topic trust. A sim eval
without asserts is a number you don't actually have.

## Lesson 3 — negative results are cheap in sim and worth publishing

Two of the series' most-cited artifacts are failures: the recovery-demo experiment
(hurt ACT, published with a mechanism and a confound section) and the dr2
targeted-coverage retrain (net zero, published with an episode-exact failure-swap
forensic). Both cost a few free-GPU hours. Both changed what I'd do next more than
the successes did — and both are the reason a reviewer can trust the positive
numbers, because the same instruments that found the failures produced them.

## Lesson 4 — the budget is a design input, not an excuse

6 GB VRAM, 42 GB disk, free T4s, no robot. That box picked MuJoCo over Isaac,
SmolVLA over π0/OpenVLA, debs over source builds, and a scripted expert over teleop
hardware — and the scripted-expert choice then *caused* the unimodal-data property
that the whole Part A/B multimodality story hangs on. Constraints don't just limit
scope; they propagate into the science. Stating them up front is what makes the
"why not X" answers honest.

## Lesson 5 — from scratch vs. library is a per-layer decision

From scratch where the fundamentals were the point and the scale allowed it: the
geometry stack (Part C), the dynamics ensemble + CEM-MPC (Part D), the KD-tree
(Part E). Libraries where the ecosystem was the point: LeRobot for data/training,
Stable-Baselines3 for RL baselines, slam_toolbox/Nav2 for navigation. The rule that
emerged: build it yourself when you need to *explain* it; use the library when you
need to *compare* against it fairly.

## What this series does not show (limitations, stated plainly)

- **Sim only.** No claim survives contact with hardware until it's made there. The
  DR study is a proxy for the sim-to-real gap, not a crossing of it.
- **One task family.** Pick-and-place with a cube; Part D adds reach/lift. No
  deformables, no clutter beyond Part C's, no long-horizon composition.
- **Mostly single training seeds** (compute budget); the report prints CIs and the
  three-seed cases (Part D) show why more would be better.
- **Scripted demonstrations only** — human teleop data would change Parts A/B in
  ways the reproduction report can only partially predict.

## What would come next

In order: (1) real hardware — an SO-101 and the sim-to-real crossing the DR study
rehearses; (2) the queued experiments from the
[reproduction report](https://github.com/ahmedsohail2003/workcell-partA-imitation/blob/master/docs/ACT_REPRODUCTION.md)
§8 — a train-time chunk sweep, CVAE-off retrains, and the untargeted-210 control
that isolates the dr2 mechanism; (3) language-conditioned *multi*-task data for
Part B, where flow matching should shine hardest.

## Review this

If any lesson above overreaches its evidence, that's exactly what the
[feedback thread](https://github.com/ahmedsohail2003/workcell-partA-imitation/discussions/1)
is for.
